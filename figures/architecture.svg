="bold" fill="#FFFFFF" text-anchor="middle">Latent representation  ·  shared feature vector</text><path d="M840,446 L840,480" fill="none" stroke="#94A3B8" stroke-width="2.6"/><line x1="235" y1="480" x2="1444" y2="480" stroke="#94A3B8" stroke-width="2.6"/><line x1="235" y1="480" x2="235" y2="495" stroke="#94A3B8" stroke-width="2.6" marker-end="url(#arr)"/><line x1="638" y1="480" x2="638" y2="495" stroke="#94A3B8" stroke-width="2.6" marker-end="url(#arr)"/><line x1="1041" y1="480" x2="1041" y2="495" stroke="#94A3B8" stroke-width="2.6" marker-end="url(#arr)"/><line x1="1444" y1="480" x2="1444" y2="495" stroke="#94A3B8" stroke-width="2.6" marker-end="url(#arr)"/><rect x="70.0" y="512.0" width="330.0" height="152.0" rx="14" ry="14" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2" /><rect x="123.0" y="498.0" width="224.0" height="34.0" rx="17" ry="17" fill="#2E7D32" stroke="none" stroke-width="0" /><text x="235.0" y="521.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Baseline</text><text x="235.0" y="560.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">MLP classifier on the</text><text x="235.0" y="580.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">shared latent representation.</text><rect x="155.0" y="606.0" width="160.0" height="32.0" rx="16" ry="16" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="1.3" /><text x="235.0" y="627.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">5 SN types</text><text x="235.0" y="684.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#94A3B8" text-anchor="middle" font-style="italic">real spectra · z as metadata</text><rect x="473.0" y="512.0" width="330.0" height="152.0" rx="14" ry="14" fill="#FFFFFF" stroke="#00838F" stroke-width="2" /><rect x="526.0" y="498.0" width="224.0" height="34.0" rx="17" ry="17" fill="#00838F" stroke="none" stroke-width="0" /><text x="638.0" y="521.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Transfer Learning</text><text x="638.0" y="560.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">Backbone pretrained on sim,</text><text x="638.0" y="580.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">then fine-tuned on real data.</text><rect x="558.0" y="606.0" width="160.0" height="32.0" rx="16" ry="16" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="1.3" /><text x="638.0" y="627.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">5 SN types</text><text x="638.0" y="684.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#94A3B8" text-anchor="middle" font-style="italic">pretrain → fine-tune</text><rect x="876.0" y="512.0" width="330.0" height="152.0" rx="14" ry="14" fill="#FFFFFF" stroke="#C98A00" stroke-width="2" /><rect x="929.0" y="498.0" width="224.0" height="34.0" rx="17" ry="17" fill="#C98A00" stroke="none" stroke-width="0" /><text x="1041.0" y="521.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Model_Z</text><text x="1041.0" y="560.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">Separate redshift + class heads;</text><text x="1041.0" y="580.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">classifier can use estimated z.</text><rect x="913.0" y="606.0" width="120.0" height="32.0" rx="16" ry="16" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="1.3" /><text x="973.0" y="627.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A" text-anchor="middle">SN type</text><rect x="1049.0" y="606.0" width="120.0" height="32.0" rx="16" ry="16" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="1.3" /><text x="1109.0" y="627.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A" text-anchor="middle">redshift</text><text x="1041.0" y="684.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#94A3B8" text-anchor="middle" font-style="italic">two heads, trained separately</text><rect x="1279.0" y="512.0" width="330.0" height="152.0" rx="14" ry="14" fill="#FFFFFF" stroke="#1565C0" stroke-width="2" /><rect x="1332.0" y="498.0" width="224.0" height="34.0" rx="17" ry="17" fill="#1565C0" stroke="none" stroke-width="0" /><text x="1444.0" y="521.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Model_mt</text><text x="1444.0" y="560.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">One multi-task head predicts</text><text x="1444.0" y="580.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">both targets jointly.</text><rect x="1316.0" y="606.0" width="120.0" height="32.0" rx="16" ry="16" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="1.3" /><text x="1376.0" y="627.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A" text-anchor="middle">SN type</text><rect x="1452.0" y="606.0" width="120.0" height="32.0" rx="16" ry="16" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="1.3" /><text x="1512.0" y="627.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A" text-anchor="middle">redshift</text><text x="1444.0" y="684.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#94A3B8" text-anchor="middle" font-style="italic">type &amp; z, trained jointly</text><text x="840.0" y="722.0" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" fill="#64748B" text-anchor="middle" font-style="italic">Every variant shares the same pretrained backbone — only the head and the training scheme change.</text></svg>